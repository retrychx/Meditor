name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (macOS 14)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Archive .app bundle
        run: |
          bash scripts/bundle.sh
          ditto -c -k --keepParent .build/debug/MEditor.app MEditor.zip

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEditor-macOS14
          path: MEditor.zip
          compression-level: 0
