name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/images/**'
      - 'wrangler.toml'
      - 'scripts/deploy-docs.sh'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 需要在仓库 Settings → Secrets 配置 CLOUDFLARE_API_TOKEN
      # （My Profile → API Tokens → 创建，模板 "Edit Cloudflare Workers"）。
      # 若账号下有多个 Cloudflare 账户，再补 CLOUDFLARE_ACCOUNT_ID。
      - name: Deploy
        run: bash scripts/deploy-docs.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
