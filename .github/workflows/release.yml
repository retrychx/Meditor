name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build (release)
        run: swift build -c release

      - name: Bundle .app
        run: |
          bash scripts/bundle.sh release
          ditto -c -k --keepParent .build/release/MEditor.app MEditor-${{ github.ref_name }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: MEditor-*.zip
          draft: false
          generate_release_notes: true
