<!DOCTYPE html>
<html lang="en" class="theme-{{INITIAL_THEME}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEditor Preview</title>

<!-- All themes inlined as one stylesheet — switching themes is just a
     class change on <html>, no stylesheet swap or reload. -->
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/base.css">

<!-- Preload hljs so it's in HTTP cache when first code block triggers it -->
<link rel="preload" href="highlight.min.js" as="script">

<!-- Vendor: marked for Markdown parsing (sync — needed immediately) -->
<script src="marked.min.js"></script>

<!-- MEditor scripts -->
<script src="scripts/render.js"></script>
<script src="scripts/bridge.js"></script>
</head>
<body>
<div id="content"></div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    window.MEditor.boot({{INITIAL_CONTENT_JSON}});
    // Pre-parse hljs during idle so it's ready before user scrolls to code.
    if (typeof window.requestIdleCallback === 'function') {
      window.requestIdleCallback(function () {
        var s = document.createElement('script');
        s.src = 'highlight.min.js';
        document.head.appendChild(s);
      }, { timeout: 2000 });
    }
  });
</script>
</body>
</html>
