<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.4/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.0/build/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.0/build/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.0/build/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --text: #24292e;
    --border: #e1e4e8;
    --code-bg: #f6f8fa;
    --blockquote-border: #d0d7de;
    --blockquote-text: #57606a;
    --link: #0969da;
    --heading: #1f2328;
    --hr: #d0d7de;
    --table-bg: #f6f8fa;
    --table-border: #d0d7de;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --text: #c9d1d9;
      --border: #30363d;
      --code-bg: #161b22;
      --blockquote-border: #30363d;
      --blockquote-text: #8b949e;
      --link: #58a6ff;
      --heading: #e6edf3;
      --hr: #30363d;
      --table-bg: #161b22;
      --table-border: #30363d;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
    padding: 32px 40px;
    max-width: 900px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, h5, h6 {
    color: var(--heading);
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 600;
    line-height: 1.25;
  }
  h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  h3 { font-size: 1.25em; }
  h4 { font-size: 1em; }

  p { margin-bottom: 16px; }

  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  ul, ol { padding-left: 2em; margin-bottom: 16px; }
  li { margin-bottom: 4px; }

  blockquote {
    margin: 0 0 16px;
    padding: 0 16px;
    color: var(--blockquote-text);
    border-left: 4px solid var(--blockquote-border);
  }

  code {
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 13px;
    padding: 2px 6px;
    background: var(--code-bg);
    border-radius: 4px;
  }

  pre {
    margin-bottom: 16px;
    border-radius: 8px;
    overflow: hidden;
  }
  pre code {
    padding: 16px;
    display: block;
    overflow-x: auto;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
  }

  hr {
    height: 1px;
    border: none;
    background: var(--hr);
    margin: 24px 0;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 16px;
  }
  th, td {
    border: 1px solid var(--table-border);
    padding: 8px 12px;
    text-align: left;
  }
  th { background: var(--table-bg); font-weight: 600; }
  tr:nth-child(even) { background: var(--table-bg); }

  img { max-width: 100%; border-radius: 6px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: var(--blockquote-text);
    font-size: 16px;
  }
</style>
</head>
<body>
<div id="content"><div class="empty-state">Preview</div></div>

<script>
let isFirstRender = true;

window.renderContent = function(content, isMarkdown) {
  const container = document.getElementById('content');

  if (!content || content.trim().length === 0) {
    container.innerHTML = '<div class="empty-state">Preview</div>';
    return;
  }

  if (isMarkdown) {
    try {
      const html = marked.parse(content, {
        breaks: true,
        gfm: true,
        highlight: function(code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            try {
              return hljs.highlight(code, { language: lang }).value;
            } catch (e) {}
          }
          return code;
        }
      });
      container.innerHTML = html;
    } catch(e) {
      container.textContent = content;
    }
  } else {
    // HTML content - render directly in a sandboxed iframe concept
    // Actually, just display it directly (it's HTML preview)
    // Use srcdoc approach for safety
    container.innerHTML = content;
  }
};

// Initial state
document.addEventListener('DOMContentLoaded', () => {
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.previewMessage) {
    window.webkit.messageHandlers.previewMessage.postMessage({ type: 'ready' });
  }
});
</script>
</body>
</html>
