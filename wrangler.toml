name = "meditor-app"
compatibility_date = "2026-07-19"
main = "worker/index.js"

# 官网静态资源（website/ 目录）
[assets]
directory = "./website"

# 分享文档存储（GET /d/:id）
[[kv_namespaces]]
binding = "SHARES"
id = "5347b6339e844206963de1732708d375"

# 应用更新包与 appcast（GET /update/*，发布走 POST /api/update/* + Bearer UPDATE_TOKEN）
[[kv_namespaces]]
binding = "UPDATES"
id = "3f5d703eda614a0aaaf17f7998000364"
